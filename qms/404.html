<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>页面不存在 · QMS 来料异常管理</title>
<style>
:root{--navy:#10253D;--green:#6FD1BE;--muted:#8FA6BC}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(700px 500px at 75% 10%,rgba(22,136,120,.28),transparent 65%),linear-gradient(160deg,#091A2C,#10253D 55%,#12314A);color:#fff;font:15px/1.75 "Microsoft YaHei","PingFang SC",system-ui,sans-serif}
.card{max-width:480px;text-align:center}
.brand{font-size:26px;font-weight:800;letter-spacing:.14em;margin-bottom:40px}
.brand i{color:var(--green);font-style:normal}
.code{font-size:64px;font-weight:800;line-height:1;color:var(--green);letter-spacing:-.02em}
h1{font-size:22px;margin:18px 0 8px}
p{color:var(--muted);margin:0 0 26px}
a{display:inline-flex;align-items:center;justify-content:center;height:46px;padding:0 22px;border-radius:8px;background:#0E6B5F;color:#fff;text-decoration:none;font-weight:600;font-size:14px}
a:hover{background:#0A5A50}
</style>
</head>
<body>
<div class="card">
  <div class="brand">QMS<i>.</i></div>
  <div class="code">404</div>
  <h1>页面不存在</h1>
  <p>链接可能已失效，或地址输入有误。</p>
  <a href="/">返回案例首页</a>
</div>
</body>
</html>
