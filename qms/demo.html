<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QMS 来料异常管理 · 交互原型</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2310253D'/%3E%3Ctext x='32' y='44' font-family='Arial,sans-serif' font-size='30' font-weight='700' fill='%236FD1BE' text-anchor='middle'%3EQ%3C/text%3E%3C/svg%3E">
<style>
:root{--ink:#203450;--muted:#718096;--bg:#f3f6fa;--line:#e1e7ef;--green:#168878}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px/1.6 'Microsoft YaHei',system-ui,sans-serif;color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:6px;padding:9px 16px;background:white;color:var(--ink)}button:hover{border-color:var(--green)}button.primary{background:var(--green);color:#fff;border-color:var(--green)}button.danger{color:#b54b42}aside{width:214px;position:fixed;inset:0 auto 0 0;background:#142b47;color:#bbcadc;padding:30px 20px}.brand{color:white;font-size:25px;font-weight:700;letter-spacing:2px}.brand small{display:block;font-size:11px;letter-spacing:1px;color:#92a8c0;font-weight:400;margin-top:2px}.nav{display:block;text-align:left;width:100%;border:0;background:transparent;color:inherit;margin:9px 0;padding:12px 16px}.nav.active{background:#244763;color:#fff}.navtitle{font-size:11px;color:#8fa6be;margin:35px 16px 8px}.sidefoot{position:absolute;bottom:26px;font-size:12px;color:#92a8c0}main{margin-left:214px}header{background:#fff;border-bottom:1px solid var(--line);height:77px;display:flex;align-items:center;justify-content:space-between;padding:0 36px}header select{border:1px solid var(--line);padding:7px;border-radius:5px;color:var(--ink);background:#fff}.content{max-width:1420px;margin:auto;padding:30px 36px}h1{font-size:26px;line-height:1.3;margin:0 0 9px}h2{font-size:17px;margin:0 0 18px}p{margin:8px 0}.muted{color:var(--muted)}.small{font-size:12px}.row{display:flex;align-items:center;gap:12px}.between{justify-content:space-between}.intro{margin-bottom:25px}.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:24px;margin-bottom:22px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-bottom:24px}.metric{padding:23px;background:#fff;border:1px solid var(--line);border-radius:10px}.metric strong{display:block;font-size:31px;margin-top:7px}.metric span{font-size:12px;color:var(--muted)}table{border-collapse:collapse;width:100%;text-align:left;white-space:nowrap}th{font-weight:400;background:#f6f8fb;color:#77879b;font-size:12px}td,th{padding:15px 12px;border-bottom:1px solid #edf0f4}td a{color:#168878;text-decoration:none;font-weight:600}tr[data-id]{cursor:pointer}tr[data-id]:hover{background:#f8fbfa}.badge{display:inline-block;background:#e8f4f1;color:#168878;padding:3px 10px;border-radius:4px;font-size:12px}.badge.wait{background:#fff3df;color:#a66a16}.badge.closed{background:#edf0f5;color:#748198}.filters{display:flex;gap:12px;margin-bottom:20px}.filters input{flex:1}input,select,textarea{border:1px solid #d7dfe9;border-radius:5px;padding:10px 12px;color:var(--ink);background:#fff;width:100%}textarea{min-height:90px;resize:vertical}label{display:block;font-size:13px;margin-bottom:7px}label b{color:#ca5b50}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px 24px}.full{grid-column:1/-1}.value{padding:12px;background:#f6f8fb;border-radius:5px;overflow-wrap:anywhere;white-space:pre-wrap}.steps{display:flex;gap:8px;margin:24px 0}.step{flex:1;background:#e8edf3;padding:11px;text-align:center;border-radius:5px;color:#8492a3;font-size:12px}.step.current{background:#168878;color:white}.step.done{color:#168878;background:#e3f1ed}.detailgrid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:22px}.timeline{padding:0;list-style:none}.timeline li{border-left:2px solid #dce6ee;padding:0 0 22px 17px;overflow-wrap:anywhere}.timeline strong{display:block;font-size:13px}.timeline time{font-size:11px;color:#8b98a8}.notice{background:#f0f6fb;border-radius:6px;padding:12px 16px;color:#5c718b;font-size:12px;margin:18px 0}.error{color:#b54b42;background:#fff0ed;padding:10px 15px;border-radius:5px;display:none}.empty{text-align:center;color:#8492a3;padding:45px}.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:#163e38;color:white;padding:12px 26px;border-radius:7px;box-shadow:0 5px 20px #0002;z-index:9}#app{min-height:80vh}.scroll{overflow-x:auto}.link{color:var(--green)}.flowimg{width:100%;min-width:1050px}header .row{white-space:nowrap}header label{margin:0}.toolbar{margin-top:24px;display:flex;gap:12px;justify-content:flex-end}.subtle{font-size:12px;color:#7d8fa4;border:0;background:transparent;padding:0}.round{height:28px;width:28px;border-radius:50%;display:inline-grid;place-items:center;background:#e7f1ee;color:#168878;font-weight:bold}.readonly{background:#f3f5f8}.archive{font-size:12px;padding:12px 0;border-top:1px solid var(--line);white-space:pre-wrap;overflow-wrap:anywhere}@media(max-width:1000px){aside{width:170px}main{margin-left:170px}.content{padding:24px 20px}header{padding:0 20px}.detailgrid{grid-template-columns:1fr}.metrics{gap:10px}}@media(max-width:700px){aside{position:static;width:auto;padding:15px}.brand{font-size:19px}.brand small,.navtitle,.sidefoot{display:none}.nav{display:inline-block;width:auto;margin:8px 0 0;padding:7px 10px}main{margin:0}header{height:auto;min-height:65px;flex-wrap:wrap;gap:8px;padding:12px 20px}.grid{grid-template-columns:1fr}.metrics{grid-template-columns:1fr 1fr}.full{grid-column:auto}.row.between{flex-wrap:wrap}.steps{overflow:auto}.step{min-width:85px}.filters{flex-wrap:wrap}.content{padding:20px 14px}}
</style>
<aside><div class="brand">QMS<span style="color:#58b7a5">.</span><small>QUALITY MANAGEMENT</small></div><div class="navtitle">质量运营 / INCOMING QUALITY</div><button class="nav active" data-page="home">◫　工作台</button><button class="nav" data-page="list">▤　异常台账</button><button class="nav" data-page="new">＋　新建异常</button><button class="nav" data-page="flow">⇄　流程与架构</button><div class="sidefoot">产品设计展示案例<br>V1.0 · 本机演示数据<br><button class="subtle" id="reset" style="color:#a7bdcf;margin-top:16px">重置演示数据</button><br><a href="index.html" target="_top" style="display:inline-block;margin-top:10px;color:#a7bdcf;text-decoration:none;font-size:12px">← 返回案例介绍</a></div></aside>
<main><header><div>质量管理 <span class="muted"> / 来料异常</span></div><div class="row"><span class="badge">交互原型</span><label for="role">演示角色</label><select id="role" style="width:145px"><option>IQC 检验员</option><option>质量工程师 QE</option><option>质量主管</option><option>仓库执行人</option></select><span class="round">演</span></div></header><div id="app" class="content"></div></main>
<script>
'use strict';
const KEY='qms_portfolio_v1';const states=['草稿','待处理','待评审','待执行','待复验','已关闭'];let page='home',current=null,search='',filter='全部状态',role='IQC 检验员';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const now=()=>new Date().toLocaleString('zh-CN',{hour12:false});
const log=(r,action,note)=>r.logs.unshift({time:now(),role,action,note});
function seeds(){let base={inspection:'IQC-20261116-001',supplier:'华成精密制造（示例）',material:'铝合金壳体 AL-208',batch:'LOT-20261116-A',qty:500,sample:50,bad:3,category:'外观',description:'抽检发现壳体表面存在明显划伤，位置集中于正面边角。',evidence:'外观划伤照片 3 张（演示）',round:1,archives:[],logs:[],factLocked:true};return [{...structuredClone(base),id:'NC20261116001',status:'待处理',logs:[{time:'2026/11/16 09:15:00',role:'IQC 检验员',action:'提交异常',note:'草稿 → 待处理'}]},{...structuredClone(base),id:'NC20261115002',status:'待执行',supplier:'恒远电子（示例）',batch:'LOT-20261115-B',method:'分选',plan:'对整批500件进行全数分选，剔除划伤件，合格件重新标识后交IQC复验。',executor:'王库管（示例）',deadline:'2026-11-15T18:00',logs:[{time:'2026/11/15 11:20:00',role:'质量主管',action:'评审通过',note:'待评审 → 待执行；同意分选，请完整留存分选记录。'}]},{...structuredClone(base),id:'NC20261114003',status:'已关闭',batch:'LOT-20261114-C',method:'退货',plan:'整批500件退回供应商，由仓库上传退货单，IQC核验退货记录。',executor:'王库管（示例）',deadline:'2026-11-15T12:00',handled:500,result:'整批500件已退回，完成隔离解除并更新标签。',voucher:'退货单 RT-003（示例）',retest:1,conclusion:'合格',basis:'核对退货凭证及批次数量，整批退货记录齐全。',logs:[{time:'2026/11/14 16:30:00',role:'IQC 检验员',action:'复验合格并关闭',note:'待复验 → 已关闭'}]}]}
const originalSeeds=seeds;seeds=function(){const rs=originalSeeds();rs.push({...structuredClone(rs[0]),id:'NC20261116004',status:'草稿',factLocked:false,logs:[{time:'2026/11/16 09:30:00',role:'IQC 检验员',action:'保存草稿',note:'等待补充证据并提交'}]});return rs};
let records;try{records=JSON.parse(localStorage.getItem(KEY))||seeds()}catch{records=seeds()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(records))}catch{toast('浏览器存储不可用，数据仅保留至本次页面关闭')}}
function toast(s){document.querySelector('.toast')?.remove();let e=document.createElement('div');e.className='toast';e.textContent=s;document.body.append(e);setTimeout(()=>e.remove(),3000)}
function badge(s){return `<span class="badge ${s==='已关闭'?'closed':['待评审','待执行'].includes(s)?'wait':''}">${esc(s)}</span>`}
function overdue(r){return r.status!=='已关闭'&&r.deadline&&new Date(r.deadline)<new Date()}
function table(rs){return `<div class="scroll"><table><thead><tr><th>异常单号</th><th>供应商 / 物料</th><th>批次</th><th>不良 / 抽检</th><th>状态</th><th>操作</th></tr></thead><tbody>${rs.map(r=>`<tr data-id="${esc(r.id)}"><td><a href="#">${esc(r.id)}</a><br><span class="muted small">第 ${r.round} 轮处置</span></td><td>${esc(r.supplier)}<br><span class="muted small">${esc(r.material)}</span></td><td>${esc(r.batch)}</td><td>${r.bad} / ${r.sample} PCS</td><td>${badge(r.status)} ${overdue(r)?'<span class="small" style="color:#bd6552">逾期</span>':''}</td><td class="link">查看详情 →</td></tr>`).join('')||'<tr><td colspan="6" class="empty">未找到异常单，请调整筛选条件</td></tr>'}</tbody></table></div>`}
function metrics(){let vals=[records.filter(r=>r.status!=='已关闭').length,records.filter(r=>r.status==='待评审').length,records.filter(overdue).length,records.filter(r=>r.status==='已关闭').length];return `<div class="metrics">${['未关闭异常','待质量评审','逾期未关闭','累计已关闭'].map((s,i)=>`<div class="metric"><span>${s}</span><strong style="${i===2?'color:#b77b37':''}">${vals[i]}<small style="font-size:12px;color:#9ba8b7;font-weight:400;margin-left:8px">单</small></strong></div>`).join('')}</div>`}
function navigate(p){page=p;if(p==='list'){search='';filter='全部状态'}render()}
function render(){document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n.dataset.page===page));const a=document.getElementById('app');
 if(page==='home'){const allowed={'IQC 检验员':['草稿','待复验'],'质量工程师 QE':['待处理'],'质量主管':['待评审'],'仓库执行人':['待执行']}[role];a.innerHTML=`<div class="row between intro"><div><h1>质量工作台</h1><p class="muted">关注来料异常的处理进度，让每个问题有据可循。</p></div><button class="primary" data-go="new">＋ 新建异常</button></div>${metrics()}<div class="card"><div class="row between"><h2>我的待办 <span class="muted small">${esc(role)}</span></h2><button data-go="list">查看全部异常 →</button></div>${table(records.filter(r=>allowed.includes(r.status)))}</div><div class="notice">演示建议：打开待处理单，切换为 QE 提交方案，再依次切换主管、仓库和 IQC，演示完整闭环。数据仅保存在本机浏览器。</div>`}
 if(page==='list'){a.innerHTML=`<div class="row between intro"><div><h1>异常台账</h1><p class="muted">统一查看异常事实、处理状态与历史记录。</p></div><button class="primary" data-go="new">＋ 新建异常</button></div><div class="card"><div class="filters"><input aria-label="搜索异常单" id="search" placeholder="搜索异常单号、供应商、物料或批次" value="${esc(search)}"><select aria-label="筛选状态" id="filter" style="width:155px">${['全部状态',...states].map(s=>`<option ${filter===s?'selected':''}>${s}</option>`)}</select></div><div id="results"></div></div>`;updateResults()}
 if(page==='new')newForm();if(page==='detail')detail();if(page==='flow'){a.innerHTML=`<div class="intro"><h1>流程与信息架构</h1><p class="muted">角色交接、驳回路径与复验闭环。</p></div><div class="card scroll"><img class="flowimg" src="assets/process.svg" alt="来料异常处理泳道图"></div><div class="card"><h2>产品信息架构</h2><p>QMS / 来料异常</p><div class="grid"><div class="value">工作台<br><span class="muted small">指标概览 · 当前角色待办</span></div><div class="value">异常台账<br><span class="muted small">多字段搜索 · 状态筛选 · 详情入口</span></div><div class="value">新建异常<br><span class="muted small">检验事实 · 缺陷描述 · 暂存与提交</span></div><div class="value">异常详情<br><span class="muted small">基本信息 · 处置 · 评审 · 执行 · 复验 · 日志</span></div></div></div>`}}
function updateResults(){let rs=records.filter(r=>(filter==='全部状态'||r.status===filter)&&[r.id,r.supplier,r.material,r.batch].some(v=>v.toLowerCase().includes(search.toLowerCase())));document.getElementById('results').innerHTML=table(rs)+`<p class="muted small">共 ${rs.length} 条 · 演示版展示全部匹配结果</p>`}
function field(name,label,val='',type='text',extra=''){return `<div><label for="${name}">${label}</label><input id="${name}" name="${name}" type="${type}" value="${esc(val)}" ${extra}></div>`}
function textfield(name,label,val=''){return `<div class="full"><label for="${name}">${label}</label><textarea id="${name}" name="${name}">${esc(val)}</textarea></div>`}
function newForm(r){let b=r||seeds()[0];document.getElementById('app').innerHTML=`<div class="intro"><h1>${r?'编辑异常草稿':'新建来料异常'}</h1><p class="muted">关联检验单，记录异常事实。标注 * 的字段提交时必填。</p></div><form id="newform" novalidate data-edit="${r?esc(r.id):''}" class="card"><h2>01 基本检验信息</h2><div class="grid"><div class="full"><label for="inspection">检验单号 *</label><select id="inspection" name="inspection"><option>IQC-20261116-001</option></select></div>${field('supplier','供应商',b.supplier,'text','readonly class="readonly"')}${field('material','物料',b.material,'text','readonly class="readonly"')}${field('batch','来料批次',b.batch,'text','readonly class="readonly"')}${field('qty','来料数量 PCS',b.qty,'number','readonly class="readonly"')}${field('sample','抽检数量 *',b.sample,'number',r?.factLocked?'readonly class="readonly"':'min="1" step="1"')}${field('bad','不良数量 *',b.bad,'number',r?.factLocked?'readonly class="readonly"':'min="1" step="1"')}</div><h2 style="margin-top:28px">02 异常事实与证据</h2><div class="grid"><div><label for="category">缺陷类别 *</label><select name="category" id="category">${['外观','尺寸','功能','其他'].map(s=>`<option ${b.category===s?'selected':''}>${s}</option>`)}</select></div>${textfield('description','异常描述 * 10至500字',b.description)}${textfield('evidence','证据说明 * 生产版为附件上传',b.evidence)}</div><div class="notice">当前使用固定检验单示例；供应商、物料、批次和来料数量由检验单带入。凭证用文字模拟，无真实附件上传。</div><div class="error" id="error" role="alert"></div><div class="toolbar"><button type="button" data-go="list">取消</button><button type="submit" name="intent" value="draft">保存草稿</button><button class="primary" type="submit" name="intent" value="submit">提交异常</button></div></form>`}
function value(label,v){return `<div><label class="muted">${label}</label><div class="value">${esc(v||'—')}</div></div>`}
function detail(){let r=records.find(r=>r.id===current);if(!r){navigate('list');return}document.getElementById('app').innerHTML=`<div class="row between intro"><div><p class="muted small">异常台账 / 单据详情</p><h1>${esc(r.id)} ${badge(r.status)}</h1><p class="muted">${esc(r.supplier)} · ${esc(r.batch)} · 第 ${r.round} 轮</p></div><button data-go="list">返回台账</button></div><div class="steps">${states.map((s,i)=>`<div class="step ${s===r.status?'current':i<states.indexOf(r.status)?'done':''}">${i+1} ${s}</div>`).join('')}</div><div class="detailgrid"><div><div class="card"><h2>异常基本信息</h2><div class="grid">${value('关联检验单',r.inspection)}${value('物料',r.material)}${value('来料 / 抽检 / 不良',`${r.qty} / ${r.sample} / ${r.bad} PCS`)}${value('缺陷类别',r.category)}<div class="full">${value('异常描述',r.description)}</div><div class="full">${value('证据说明',r.evidence)}</div></div></div>${r.plan?`<div class="card"><h2>本轮处置方案</h2><div class="grid">${value('处置方式',r.method)}${value('执行人',r.executor)}${value('计划完成',r.deadline.replace('T',' '))}${value('处置说明',r.plan)}${r.result?value('执行结果',r.result):''}${r.voucher?value('执行凭证',r.voucher):''}${r.basis?value('复验依据',r.basis):''}</div></div>`:''}<div class="card" id="actioncard">${actionForm(r)}</div>${r.archives.length?`<div class="card"><h2>历史处置轮次</h2>${r.archives.map(x=>`<div class="archive"><strong>第 ${x.round} 轮 · 复验不合格</strong>\n方案：${esc(x.plan)}\n执行：${esc(x.result)}\n凭证：${esc(x.voucher)}\n复验依据：${esc(x.basis)}\n不合格说明：${esc(x.fail)}</div>`).join('')}</div>`:''}</div><div><div class="card"><h2>操作轨迹</h2><ul class="timeline">${r.logs.map(l=>`<li><strong>${esc(l.action)}</strong><span class="small">${esc(l.role)}</span><br><time>${esc(l.time)}</time><p class="small muted">${esc(l.note)}</p></li>`).join('')||'<li class="muted">草稿尚无操作记录</li>'}</ul></div></div></div>`}
function actionForm(r){let needed={'草稿':'IQC 检验员','待处理':'质量工程师 QE','待评审':'质量主管','待执行':'仓库执行人','待复验':'IQC 检验员'}[r.status];if(r.status==='已关闭')return '<h2>异常已关闭</h2><p class="muted">本单据已完成闭环，保留全部业务记录，只读查看。</p>';if(role!==needed)return `<h2>当前待办</h2><p class="muted">等待 ${needed} 处理。可切换顶部演示角色查看对应操作。</p>`;if(r.status==='草稿')return '<h2>完善草稿</h2><p class="muted">补齐异常事实后提交给质量工程师。</p><button class="primary" id="editdraft">编辑并提交</button>';
 let fields='',buttons='';
 if(r.status==='待处理'){let future=new Date(Date.now()+86400000);future.setMinutes(future.getMinutes()-future.getTimezoneOffset());fields=`<div><label>处置方式 *</label><select name="method">${['退货','分选','返工'].map(s=>`<option ${r.method===s?'selected':''}>${s}</option>`)}</select></div><div><label>执行人 *</label><select name="executor"><option>王库管（示例）</option></select></div>${field('deadline','计划完成时间 *',r.deadline||future.toISOString().slice(0,16),'datetime-local')}${textfield('plan','方案说明 * 10至500字',r.plan||'对整批来料进行隔离和处置，完成后提交处置凭证，由IQC核验处理结果。')}${textfield('reason','退回补充理由 仅退回时必填')}`;buttons='<button name="action" value="return">退回补充</button><button class="primary" name="action" value="plan">提交评审</button>'}
 if(r.status==='待评审'){fields=textfield('opinion','评审意见 * 2至500字');buttons='<button class="danger" name="action" value="reject">驳回方案</button><button class="primary" name="action" value="approve">通过评审</button>'}
 if(r.status==='待执行'){fields=field('handled','处置数量 PCS * 必须覆盖整批',r.qty,'number','min="1" step="1"')+textfield('result','执行结果 * 10至500字','已按审批方案完成整批处置，批次及数量已核对。')+textfield('voucher','执行凭证说明 *','处置记录单 EX-001（演示）');buttons='<button class="primary" name="action" value="execute">完成处置</button>'}
 if(r.status==='待复验'){fields=field('retest','复验检查数量 *',Math.min(r.sample,r.handled),'number','min="1" step="1"')+`<div><label>复验结论 *</label><select name="conclusion"><option>合格</option><option>不合格</option></select></div>`+textfield('basis','复验依据 * 10至500字','已核对处置后的批次、数量和相关凭证，记录完整。')+textfield('fail','不合格说明 结论为不合格时必填');buttons='<button class="primary" name="action" value="retest">提交复验结论</button>'}
 return `<h2>${{'待处理':'制定处置方案','待评审':'质量评审','待执行':'处置执行反馈','待复验':'复验与关闭'}[r.status]}</h2><form id="actionform"><div class="grid">${fields}</div><div id="error" class="error" role="alert"></div><div class="toolbar">${buttons}</div></form>`}
function err(s){let e=document.getElementById('error');e.textContent=s;e.style.display='block';e.scrollIntoView({block:'nearest'});return false}
const len=(s,min)=>s&&s.trim().length>=min&&s.trim().length<=500;
const int=(x)=>Number.isInteger(+x)&&+x>0;
document.addEventListener('click',e=>{let nav=e.target.closest('[data-page],[data-go]');if(nav){navigate(nav.dataset.page||nav.dataset.go);return}let tr=e.target.closest('[data-id]');if(tr){e.preventDefault();current=tr.dataset.id;page='detail';render()}if(e.target.id==='editdraft'){newForm(records.find(r=>r.id===current))}if(e.target.id==='reset'&&confirm('重置会清除此原型的模拟单据，并恢复初始示例。确定继续吗？')){records=seeds();save();navigate('home');toast('已恢复初始示例')}});
document.getElementById('role').onchange=e=>{role=e.target.value;render()};
document.addEventListener('input',e=>{if(e.target.id==='search'){search=e.target.value;updateResults()}});document.addEventListener('change',e=>{if(e.target.id==='filter'){filter=e.target.value;updateResults()}});
document.addEventListener('submit',e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target)),act=e.submitter?.value;
 if(e.target.id==='newform'){if(role!=='IQC 检验员')return err('请切换为 IQC 检验员后新建或提交异常。');if(act==='submit'){if(!int(d.sample)||+d.sample>+d.qty)return err('抽检数量必须是1至来料数量的整数。');if(!int(d.bad)||+d.bad>+d.sample)return err('不良数量必须是1至抽检数量的整数。');if(!len(d.description,10))return err('异常描述需要填写10至500字；其他类别请说明具体缺陷。');if(!len(d.evidence,1))return err('请填写证据说明，最多500字。')}
 let r=records.find(r=>r.id===e.target.dataset.edit);if(r&&r.status!=='草稿')return err('单据已更新，请重新打开。');if(!r){r={id:'NC'+new Date().toISOString().slice(0,10).replaceAll('-','')+String(Date.now()).slice(-6),round:1,archives:[],logs:[]};records.unshift(r)}Object.assign(r,d,{qty:+d.qty,sample:+d.sample,bad:+d.bad,status:act==='submit'?'待处理':'草稿'});if(act==='submit')r.factLocked=true;log(r,act==='submit'?'提交异常':'保存草稿',act==='submit'?'草稿 → 待处理':'暂存未提交');current=r.id;save();page='detail';render();toast(act==='submit'?'异常已提交，等待 QE 处理':'草稿已保存');return}
 if(e.target.id==='actionform'){let r=records.find(r=>r.id===current);let before=r.status;let allowed={return:['待处理','质量工程师 QE'],plan:['待处理','质量工程师 QE'],approve:['待评审','质量主管'],reject:['待评审','质量主管'],execute:['待执行','仓库执行人'],retest:['待复验','IQC 检验员']}[act];if(!allowed||r.status!==allowed[0]||role!==allowed[1])return err('当前角色或状态无法执行该动作。');
 if(act==='return'){if(!len(d.reason,2))return err('请填写2至500字退回理由。');r.status='草稿';log(r,'退回补充',`${before} → 草稿；${d.reason}`)}
 if(act==='plan'){if(!len(d.plan,10))return err('方案说明需要10至500字。');if(!d.deadline||new Date(d.deadline)<=new Date())return err('计划完成时间必须晚于当前时间。');Object.assign(r,{method:d.method,plan:d.plan,executor:d.executor,deadline:d.deadline,status:'待评审'});log(r,'提交处置方案',`${before} → 待评审；${d.plan}`)}
 if(act==='approve'||act==='reject'){if(!len(d.opinion,2))return err('请填写2至500字评审意见。');r.status=act==='approve'?'待执行':'待处理';log(r,act==='approve'?'评审通过':'评审驳回',`${before} → ${r.status}；${d.opinion}`)}
 if(act==='execute'){if(!int(d.handled)||+d.handled!==r.qty)return err('本案例要求整批处置，处置数量必须等于来料数量。');if(!len(d.result,10))return err('执行结果需要10至500字。');if(!len(d.voucher,1))return err('请填写执行凭证说明，最多500字。');Object.assign(r,{handled:+d.handled,result:d.result,voucher:d.voucher,status:'待复验'});log(r,'完成处置',`${before} → 待复验；${d.result}；凭证：${d.voucher}`)}
 if(act==='retest'){if(!int(d.retest)||+d.retest>r.handled)return err('复验检查数量必须是1至处置数量的整数。');if(!len(d.basis,10))return err('复验依据需要10至500字。');if(d.conclusion==='不合格'&&!len(d.fail,10))return err('不合格说明需要10至500字。');Object.assign(r,{retest:+d.retest,conclusion:d.conclusion,basis:d.basis,fail:d.fail});if(d.conclusion==='合格'){r.status='已关闭';log(r,'复验合格并关闭',`${before} → 已关闭；${d.basis}`)}else{r.archives.push({round:r.round,method:r.method,plan:r.plan,result:r.result,voucher:r.voucher,basis:r.basis,fail:r.fail});log(r,'复验不合格',`${before} → 待处理；第${r.round}轮；${d.fail}`);r.round++;r.status='待处理';for(let k of ['method','plan','executor','deadline','handled','result','voucher','retest','conclusion','basis','fail'])delete r[k]}}
 save();render();toast('操作成功，状态与记录已更新')}});
save();render();
</script></html>
