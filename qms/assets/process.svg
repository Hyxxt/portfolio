<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="900" viewBox="0 0 1640 900"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#60748e"/></marker></defs><rect width="1640" height="900" fill="#f7f9fc"/><g font-family="Microsoft YaHei,Arial"><text x="40" y="52" font-size="27" font-weight="bold" fill="#162c49">来料检验异常处理 业务泳道图</text><text x="40" y="85" font-size="15" fill="#60748e">一单一批 · 整批处置 · 审批后锁定方案 · 复验不合格保留历史并进入新轮处置</text><rect x="30" y="115" width="1580" height="140" fill="#ffffff" stroke="#dbe3ee"/><text x="48" y="189" font-size="18" fill="#233c5a">IQC 检验员</text><rect x="30" y="255" width="1580" height="140" fill="#eef3f9" stroke="#dbe3ee"/><text x="48" y="329" font-size="18" fill="#233c5a">质量工程师 QE</text><rect x="30" y="395" width="1580" height="140" fill="#ffffff" stroke="#dbe3ee"/><text x="48" y="469" font-size="18" fill="#233c5a">质量主管</text><rect x="30" y="535" width="1580" height="140" fill="#eef3f9" stroke="#dbe3ee"/><text x="48" y="609" font-size="18" fill="#233c5a">仓库执行人</text><rect x="190" y="155" width="170" height="60" rx="10" fill="#e8f4f1" stroke="#168879" stroke-width="2"/><text x="275" y="191" text-anchor="middle" font-size="17" fill="#12594f">登记并提交异常</text><rect x="435" y="295" width="170" height="60" rx="10" fill="#e8f4f1" stroke="#168879" stroke-width="2"/><text x="520" y="331" text-anchor="middle" font-size="17" fill="#12594f">补充处置方案</text><rect x="685" y="435" width="170" height="60" rx="10" fill="#e8f4f1" stroke="#168879" stroke-width="2"/><text x="770" y="471" text-anchor="middle" font-size="17" fill="#12594f">评审方案</text><rect x="940" y="575" width="170" height="60" rx="10" fill="#e8f4f1" stroke="#168879" stroke-width="2"/><text x="1025" y="611" text-anchor="middle" font-size="17" fill="#12594f">执行并上传凭证</text><rect x="1190" y="155" width="170" height="60" rx="10" fill="#e8f4f1" stroke="#168879" stroke-width="2"/><text x="1275" y="191" text-anchor="middle" font-size="17" fill="#12594f">复验处置结果</text><rect x="1420" y="155" width="170" height="60" rx="10" fill="#e8f4f1" stroke="#168879" stroke-width="2"/><text x="1505" y="191" text-anchor="middle" font-size="17" fill="#12594f">关闭异常单</text><path d="M360 185H400V325H435" fill="none" stroke="#60748e" stroke-width="2" marker-end="url(#arrow)"/><text x="375" y="250" font-size="14" fill="#526780" stroke="#f7f9fc" stroke-width="5" paint-order="stroke">提交</text><path d="M605 325H650V465H685" fill="none" stroke="#60748e" stroke-width="2" marker-end="url(#arrow)"/><text x="600" y="420" font-size="14" fill="#526780" stroke="#f7f9fc" stroke-width="5" paint-order="stroke">提交评审</text><path d="M855 465H900V605H940" fill="none" stroke="#60748e" stroke-width="2" marker-end="url(#arrow)"/><text x="862" y="535" font-size="14" fill="#526780" stroke="#f7f9fc" stroke-width="5" paint-order="stroke">通过</text><path d="M1110 605H1150V185H1190" fill="none" stroke="#60748e" stroke-width="2" marker-end="url(#arrow)"/><text x="1158" y="375" font-size="14" fill="#526780" stroke="#f7f9fc" stroke-width="5" paint-order="stroke">完成处置</text><path d="M1360 185H1420" fill="none" stroke="#60748e" stroke-width="2" marker-end="url(#arrow)"/><text x="1370" y="173" font-size="14" fill="#526780" stroke="#f7f9fc" stroke-width="5" paint-order="stroke">合格</text><path d="M770 435V390H520V355" fill="none" stroke="#60748e" stroke-width="2" marker-end="url(#arrow)"/><text x="680" y="380" font-size="14" fill="#526780" stroke="#f7f9fc" stroke-width="5" paint-order="stroke">驳回</text><path d="M460 295V255H275V215" fill="none" stroke="#60748e" stroke-width="2" marker-end="url(#arrow)"/><text x="295" y="245" font-size="14" fill="#526780" stroke="#f7f9fc" stroke-width="5" paint-order="stroke">事实缺失退回</text><path d="M1275 215V735H520V355" fill="none" stroke="#60748e" stroke-width="2" marker-end="url(#arrow)"/><text x="790" y="725" font-size="14" fill="#526780" stroke="#f7f9fc" stroke-width="5" paint-order="stroke">不合格 → 待处理 → 新轮方案</text><text x="40" y="805" font-size="17" fill="#233c5a">状态映射  草稿 → 待处理 → 待评审 → 待执行 → 待复验 → 已关闭</text><text x="40" y="839" font-size="15" fill="#60748e">退回补充至草稿；评审驳回至待处理；复验不合格至待处理。所有动作记录操作者、时间、原因和前后状态。</text><text x="40" y="871" font-size="13" fill="#60748e">自主设计示例 V1.0  2026-11-16  |  不含ERP库存写回、拆批处置与特采审批</text></g></svg>